name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -q; then
              echo "Postgres ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/60)..."
            sleep 1
          done
          echo "Postgres not ready after 60s" >&2
          exit 1
      - run: pnpm db:reset
      - run: pnpm db:lint
      - run: pnpm test:db
      - run: pnpm db:types
      - run: test -s packages/supabase/src/database.generated.ts
      - run: pnpm traceability:check
      - run: pnpm verify:stack
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm functions:check
      - run: pnpm functions:test
      - run: pnpm test
      - run: pnpm build
