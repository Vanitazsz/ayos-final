name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Clean local Supabase state
        run: |
          rm -rf .supabase || true
          docker compose down -v || true
      - name: Pre-pull Supabase images (mitigate Docker pull rate limits)
        run: |
          set -euo pipefail
          images=(
            "public.ecr.aws/supabase/kong:2.8.1"
            "public.ecr.aws/supabase/postgres-meta:v0.96.6"
            "public.ecr.aws/supabase/postgrest:v14.14"
          )
          for img in "${images[@]}"; do
            for i in 1 2 3; do
              docker pull "$img" && break || { echo "docker pull $img failed, retry $i/3"; sleep $((i * 4)); }
            done
          done
      - name: Start Supabase (with retry for Docker pull flakiness)
        run: |
          for attempt in 1 2 3; do
            if pnpm supabase:start; then
              exit 0
            fi
            echo "supabase:start failed on attempt $attempt/3, retrying..."
            sleep 15
          done
          echo "supabase:start failed after 3 attempts" >&2
          exit 1
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 54332 -q; then
              echo "Postgres ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/60)..."
            sleep 1
          done
          echo "Postgres not ready after 60s" >&2
          exit 1
      - run: pnpm db:reset
      - run: pnpm db:lint
      - run: pnpm test:db
      - run: pnpm db:types
      - run: test -s packages/supabase/src/database.generated.ts
      - run: pnpm traceability:check
      - run: pnpm verify:stack
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm functions:check
      - run: pnpm functions:test
      - run: pnpm test
      - run: pnpm build
